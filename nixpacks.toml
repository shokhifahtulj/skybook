[phases.setup]
nixPkgs = ["php83","php83Extensions.mbstring","php83Extensions.pdo_mysql","php83Extensions.gd","nodejs_22"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
